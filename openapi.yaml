openapi: 3.0.3
info:
  title: ApiMe
  version: "1.3.0"
  description: |
    API para orquestração de múltiplas instâncias de WhatsApp.

    Autenticação: header `Authorization: Bearer <token>`, com três tipos de credencial
    (userJwt, apiToken, instanceToken). O middleware valida em cascata e para no primeiro
    que reconhecer o token.

    Escopo: `instanceToken` só alcança a própria instância. As rotas de perfil
    (`/instances/{id}/profile/*`, `/instances/{id}/business/*`) exigem `instanceToken` e
    recusam os demais. As rotas `/users/*` exigem usuário com role admin.

servers:
  - url: http://localhost:8080/api
    description: Local

paths:
  /healthz:
    get:
      summary: Health check
      tags: [Sistema]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /auth/login:
    post:
      summary: Autenticar usuário
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Token JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string

  /users:
    get:
      summary: Listar usuários
      tags: [Usuários]
      security: [{userJwt: []}, {apiToken: []}]  # exige role admin
      responses:
        "200":
          description: Lista de usuários
    post:
      summary: Criar usuário
      tags: [Usuários]
      security: [{userJwt: []}, {apiToken: []}]  # exige role admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum: [admin, user]
      responses:
        "201":
          description: Usuário criado

  /users/{id}:
    delete:
      summary: Remover usuário
      tags: [Usuários]
      security: [{userJwt: []}, {apiToken: []}]  # exige role admin
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: Removido

  /users/{id}/password:
    patch:
      summary: Alterar senha
      tags: [Usuários]
      security: [{userJwt: []}, {apiToken: []}]  # exige role admin
      parameters:
        - $ref: "#/components/parameters/userId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        "200":
          description: Senha alterada

  /users/{id}/token:
    post:
      summary: Rotacionar API token do usuário
      tags: [Usuários]
      security: [{userJwt: []}, {apiToken: []}]  # exige role admin
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: Novo token gerado
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string

  /instances:
    get:
      summary: Listar instâncias
      tags: [Instâncias]
      security: [{userJwt: []}, {apiToken: []}]  # token de instância recebe 403}, {apiToken: []}, {instanceToken: []}]
      responses:
        "200":
          description: Lista de instâncias
    post:
      summary: Criar instância
      tags: [Instâncias]
      security: [{userJwt: []}, {apiToken: []}]  # token de instância recebe 403}, {apiToken: []}, {instanceToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                webhook_url:
                  type: string
                webhook_secret:
                  type: string
      responses:
        "201":
          description: Instância criada

  /instances/{id}:
    get:
      summary: Detalhar instância
      tags: [Instâncias]
      security: [{userJwt: []}, {apiToken: []}, {instanceToken: []}]  # token de instância só lê a própria}, {apiToken: []}, {instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: Dados da instância
    put:
      summary: Atualizar instância
      tags: [Instâncias]
      security: [{userJwt: []}, {apiToken: []}]  # token de instância recebe 403}, {apiToken: []}, {instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                webhook_url:
                  type: string
                webhook_secret:
                  type: string
      responses:
        "200":
          description: Atualizada
    delete:
      summary: Remover instância
      tags: [Instâncias]
      security: [{userJwt: []}, {apiToken: []}]  # token de instância recebe 403}, {apiToken: []}, {instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "204":
          description: Removida

  /instances/{id}/qr:
    get:
      summary: Gerar QR Code
      tags: [Conexão]
      security: [{userJwt: []}, {apiToken: []}, {instanceToken: []}]  # token de instância só lê a própria}, {apiToken: []}, {instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: QR code base64

  /instances/{id}/disconnect:
    post:
      summary: Desconectar instância
      tags: [Conexão]
      security: [{userJwt: []}, {apiToken: []}, {instanceToken: []}]  # token de instância só desconecta a própria}, {apiToken: []}]  # token de instância recebe 403}, {apiToken: []}, {instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: Desconectado

  /instances/{id}/token/rotate:
    post:
      summary: Rotacionar token da instância
      tags: [Instâncias]
      security: [{userJwt: []}, {apiToken: []}]  # token de instância recebe 403}, {apiToken: []}, {instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: Novo token

  /instances/{id}/messages/text:
    post:
      summary: Enviar texto
      tags: [Mensagens]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, text]
              properties:
                to:
                  type: string
                  example: "5511999999999"
                text:
                  type: string
                quoted:
                  type: string
                  description: Message ID (HEX) da mensagem citada
      responses:
        "409":
          description: Requisição com a mesma Idempotency-Key ainda em andamento
        "503":
          description: Sessão não pronta. Nada foi enviado e a Idempotency-Key é liberada para nova tentativa
        "422":
          description: Idempotency-Key já usada com outro conteúdo
        "200":
          description: Enviado

  /instances/{id}/messages/media:
    post:
      summary: Enviar mídia (imagem ou vídeo)
      tags: [Mensagens]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [to, type, file]
              properties:
                to:
                  type: string
                  description: JID do destinatário
                type:
                  type: string
                  enum: [image, video]
                  description: Tipo de mídia
                file:
                  type: string
                  format: binary
                  description: Arquivo de imagem ou vídeo
                caption:
                  type: string
                  description: Legenda (opcional)
                quoted:
                  type: string
                  description: ID da mensagem citada (opcional)
      responses:
        "409":
          description: Requisição com a mesma Idempotency-Key ainda em andamento
        "503":
          description: Sessão não pronta. Nada foi enviado e a Idempotency-Key é liberada para nova tentativa
        "422":
          description: Idempotency-Key já usada com outro conteúdo
        "200":
          description: Enviado


  /instances/{id}/messages/audio:
    post:
      summary: Enviar áudio
      tags: [Mensagens]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [to, file]
              properties:
                to:
                  type: string
                  description: JID do destinatário
                file:
                  type: string
                  format: binary
                  description: Arquivo de áudio
                ptt:
                  type: boolean
                  description: Push-to-Talk (áudio de voz)
                  default: false
                seconds:
                  type: integer
                  description: Duração em segundos
                quoted:
                  type: string
                  description: ID da mensagem citada (opcional)
      responses:
        "409":
          description: Requisição com a mesma Idempotency-Key ainda em andamento
        "503":
          description: Sessão não pronta. Nada foi enviado e a Idempotency-Key é liberada para nova tentativa
        "422":
          description: Idempotency-Key já usada com outro conteúdo
        "200":
          description: Enviado


  /instances/{id}/messages/document:
    post:
      summary: Enviar documento
      tags: [Mensagens]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [to, file]
              properties:
                to:
                  type: string
                  description: JID do destinatário
                file:
                  type: string
                  format: binary
                  description: Arquivo do documento
                caption:
                  type: string
                  description: Legenda (opcional)
                filename:
                  type: string
                  description: Nome do arquivo (opcional)
                quoted:
                  type: string
                  description: ID da mensagem citada (opcional)
      responses:
        "409":
          description: Requisição com a mesma Idempotency-Key ainda em andamento
        "503":
          description: Sessão não pronta. Nada foi enviado e a Idempotency-Key é liberada para nova tentativa
        "422":
          description: Idempotency-Key já usada com outro conteúdo
        "200":
          description: Enviado


  /media/{instanceId}/{mediaId}:
    get:
      summary: Download de mídia
      tags: [Mídia]
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Arquivo binário

  /instances/{id}/info:
    get:
      summary: Informações da instância conectada
      tags: [Conexão]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: Status e JID da instância

  /instances/{id}/whatsapp/groups:
    get:
      summary: Listar grupos que a instância faz parte
      tags: [WhatsApp]
      security: [{userJwt: []}, {apiToken: []}, {instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: Lista de grupos
    post:
      summary: Criar grupo
      tags: [WhatsApp]
      security: [{userJwt: []}, {apiToken: []}, {instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                participants:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Grupo criado

  /instances/{id}/profile/{jid}:
    get:
      summary: Obter perfil de contato
      tags: [Perfil]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - name: jid
          in: path
          required: true
          schema:
            type: string
          description: JID do contato
      responses:
        "200":
          description: Dados do perfil

  /instances/{id}/business/{jid}:
    get:
      summary: Obter perfil business
      tags: [Perfil]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - name: jid
          in: path
          required: true
          schema:
            type: string
          description: JID do contato
      responses:
        "200":
          description: Dados do perfil business

  /instances/{id}/profile/{jid}/picture:
    get:
      summary: Obter foto de perfil
      tags: [Perfil]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - name: jid
          in: path
          required: true
          schema:
            type: string
          description: JID do contato
      responses:
        "200":
          description: URL da foto de perfil

  /instances/{id}/messages:
    post:
      summary: Enfileirar mensagem genérica
      tags: [Mensagens]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, type, payload]
              properties:
                to:
                  type: string
                type:
                  type: string
                  description: Tipo da mensagem
                payload:
                  type: string
                  description: Conteúdo serializado
      responses:
        "409":
          description: Requisição com a mesma Idempotency-Key ainda em andamento
        "503":
          description: Sessão não pronta. Nada foi enviado e a Idempotency-Key é liberada para nova tentativa
        "422":
          description: Idempotency-Key já usada com outro conteúdo
        "200":
          description: Mensagem enfileirada
    get:
      summary: Listar mensagens da instância
      tags: [Mensagens]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: Lista de mensagens

  /instances/{id}/messages/contact:
    post:
      summary: Enviar contato
      tags: [Mensagens]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, displayName]
              properties:
                to:
                  type: string
                displayName:
                  type: string
                vcard:
                  type: string
                quoted:
                  type: string
                  description: ID da mensagem citada
                quotedParticipant:
                  type: string
                quotedText:
                  type: string
                quotedFromMe:
                  type: boolean
                mentionedJids:
                  type: array
                  items:
                    type: string
      responses:
        "409":
          description: Requisição com a mesma Idempotency-Key ainda em andamento
        "503":
          description: Sessão não pronta. Nada foi enviado e a Idempotency-Key é liberada para nova tentativa
        "422":
          description: Idempotency-Key já usada com outro conteúdo
        "200":
          description: Contato enviado

  /instances/{id}/messages/location:
    post:
      summary: Enviar localização
      tags: [Mensagens]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, latitude, longitude]
              properties:
                to:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
                name:
                  type: string
                address:
                  type: string
                quoted:
                  type: string
                quotedParticipant:
                  type: string
                quotedText:
                  type: string
                quotedFromMe:
                  type: boolean
      responses:
        "409":
          description: Requisição com a mesma Idempotency-Key ainda em andamento
        "503":
          description: Sessão não pronta. Nada foi enviado e a Idempotency-Key é liberada para nova tentativa
        "422":
          description: Idempotency-Key já usada com outro conteúdo
        "200":
          description: Localização enviada

  /instances/{id}/events:
    get:
      summary: Histórico de eventos de conexão da instância
      tags: [Instâncias]
      security: [{userJwt: []}, {apiToken: []}, {instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: Lista de eventos

  /tokens:
    get:
      summary: Listar tokens de API do usuário
      tags: [Tokens]
      security: [{userJwt: []}, {apiToken: []}]
      responses:
        "200":
          description: Lista de tokens
    post:
      summary: Criar token de API
      tags: [Tokens]
      security: [{userJwt: []}, {apiToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                expiresAt:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Token criado

  /tokens/{tokenId}:
    delete:
      summary: Remover token de API
      tags: [Tokens]
      security: [{userJwt: []}, {apiToken: []}]
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removido

  /instances/{id}/whatsapp/check:
    post:
      summary: Verificar se um número tem WhatsApp
      tags: [WhatsApp Contatos]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
      responses:
        "200":
          description: Resultado
        "403":
          description: Token não é da instância, ou não é token de instância

  /instances/{id}/whatsapp/presence:
    post:
      summary: Definir presença no chat
      tags: [WhatsApp Mensagens]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                to:
                  type: string
                state:
                  type: string
                  description: composing, paused, available ou unavailable
      responses:
        "200":
          description: Enviada
        "403":
          description: Token não é da instância, ou não é token de instância

  /instances/{id}/whatsapp/contacts:
    get:
      summary: Listar contatos
      tags: [WhatsApp Contatos]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: Lista
        "403":
          description: Token não é da instância, ou não é token de instância

  /instances/{id}/whatsapp/contacts/{jid}:
    get:
      summary: Detalhar contato
      tags: [WhatsApp Contatos]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - name: jid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Contato
        "403":
          description: Token não é da instância, ou não é token de instância

  /instances/{id}/whatsapp/userinfo/{jid}:
    get:
      summary: Informações públicas do usuário
      tags: [WhatsApp Contatos]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - name: jid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dados
        "403":
          description: Token não é da instância, ou não é token de instância

  /instances/{id}/whatsapp/messages/read:
    post:
      summary: Marcar mensagem como lida
      tags: [WhatsApp Mensagens]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat, message_id]
              properties:
                chat:
                  type: string
                message_id:
                  type: string
                sender:
                  type: string
                  description: Obrigatório em grupo
                played:
                  type: boolean
                  description: Marca áudio como ouvido
      responses:
        "200":
          description: Marcada
        "403":
          description: Token não é da instância, ou não é token de instância

  /instances/{id}/whatsapp/messages/delete:
    post:
      summary: Apagar mensagem para todos
      tags: [WhatsApp Mensagens]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat, message_id]
              properties:
                chat:
                  type: string
                message_id:
                  type: string
                sender:
                  type: string
      responses:
        "200":
          description: Apagada
        "403":
          description: Token não é da instância, ou não é token de instância

  /instances/{id}/whatsapp/messages/edit:
    post:
      summary: Editar mensagem enviada
      tags: [WhatsApp Mensagens]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat, message_id, text]
              properties:
                chat:
                  type: string
                message_id:
                  type: string
                text:
                  type: string
      responses:
        "200":
          description: Editada
        "403":
          description: Token não é da instância, ou não é token de instância

  /instances/{id}/whatsapp/messages/react:
    post:
      summary: Reagir a uma mensagem
      tags: [WhatsApp Mensagens]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat, message_id]
              properties:
                chat:
                  type: string
                message_id:
                  type: string
                emoji:
                  type: string
                  description: Vazio remove a reação
                sender:
                  type: string
                from_me:
                  type: boolean
      responses:
        "200":
          description: Reagida
        "403":
          description: Token não é da instância, ou não é token de instância

  /instances/{id}/whatsapp/privacy:
    get:
      summary: Ler privacidade
      tags: [WhatsApp Configurações]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: Configurações
        "403":
          description: Token não é da instância, ou não é token de instância
    post:
      summary: Alterar uma configuração de privacidade
      tags: [WhatsApp Configurações]
      security: [{instanceToken: []}]
      parameters:
