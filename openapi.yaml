  /instances/{id}/whatsapp/appstate/resync:
    post:
      summary: Ressincronizar app state
      description: >
        Descarta a cópia local das coleções informadas e baixa um snapshot novo do WhatsApp.
        Repara uma coleção que divergiu do servidor (mismatching LTHash), caso em que o whatsmeow
        para de aplicar patches e não tenta de novo sozinho. Sem corpo, ressincroniza
        critical_unblock_low (a agenda, que define quem vê um story) e regular (as listas de
        transmissão). A apime também faz isso sozinha quando uma sincronização falha, com intervalo
        mínimo entre tentativas, então esta rota é a saída manual.
      tags: [WhatsApp]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                collections:
                  type: array
                  items:
                    type: string
                    enum: [critical_block, critical_unblock_low, regular, regular_high, regular_low]
      responses:
        "200":
          description: >-
            Ressincronizado. Devolve resynced e skipped: uma coleção ressincronizada nos
            últimos 15 minutos entra em skipped em vez de sincronizar de novo, o que limita
            a frequência com que um snapshot inteiro é puxado do WhatsApp. Chamar duas vezes
            seguidas responde 200 com resynced vazio, e isso é resultado normal, não falha.
          content:
            application/json:
              schema:
                type: object
                properties:
                  resynced:
                    type: array
                    items:
                      type: string
                  skipped:
                    type: array
                    items:
                      type: string
        "400":
          description: Coleção inválida, ou instância não conectada
        "403":
          description: Token não é da instância, ou não é token de instância

  /instances/{id}/whatsapp/broadcast-lists:
    get:
      summary: Listar listas de transmissão
      tags: [WhatsApp Listas de Transmissão]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      description: >-
        Devolve {"lists": [...]}, e cada item traz jid, name, participants
        (pn e lid de cada destinatário), labelIds e updatedAt em RFC3339.
        A lista é local do remetente: quem recebe vê uma conversa 1:1 comum e
        nunca sabe que a lista existe. As listas vêm da sincronização de app
        state com o celular, então uma lista criada no aparelho só aparece aqui
        depois que o app state sincroniza. Não há como criar lista pela API.
      responses:
        "200":
          description: Lista
        "403":
          description: Token não é da instância, ou não é token de instância

  /instances/{id}/whatsapp/broadcast-lists/{jid}:
    get:
      summary: Detalhar lista de transmissão
      tags: [WhatsApp Listas de Transmissão]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - name: jid
          in: path
          required: true
          schema:
            type: string
          description: JID completo (123@broadcast) ou só o id (123)
      description: >-
        Devolve o objeto da lista direto, com jid, name, participants, labelIds
        e updatedAt. A lista só existe aqui depois da sincronização de app state
        com o celular: antes disso, a resposta é 404.
      responses:
        "200":
          description: Dados
        "403":
          description: Token não é da instância, ou não é token de instância
        "404":
          description: Lista não encontrada. Ela só aparece após a sincronização com o celular

  /instances/{id}/stories/text:
    post:
      summary: Publicar story de texto
      tags: [Stories]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/idempotencyKey"
      description: >-
        Publica um story de texto. A audiência não é informada pelo chamador:
        vale a configuração de privacidade de status da conta, consultável em
        GET /instances/{id}/whatsapp/status-privacy. Não confundir com
        POST /instances/{id}/whatsapp/status, que define o recado do perfil.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                whatsappId:
                  $ref: "#/components/schemas/WhatsAppMessageId"
                text:
                  type: string
                backgroundArgb:
                  type: integer
                  format: int64
                  description: >-
                    Cor de fundo do card, em ARGB opaco (ex: 4280427042 para 0xFF25D366).
                    Omitido usa o verde do WhatsApp. Um story de texto sempre carrega fundo,
                    então a apime define um de qualquer forma.
                textArgb:
                  type: integer
                  format: int64
                  description: Cor do texto, em ARGB opaco. Omitido usa branco.
                font:
                  type: string
                  enum: [system, system_text, system_bold, fb_script, morningbreeze_regular, calistoga_regular, exo2_extrabold, courierprime_bold]
                  description: Fonte do card. Valor desconhecido cai na fonte do sistema.
      responses:
        "409":
          description: Requisição com a mesma Idempotency-Key ainda em andamento
        "503":
          description: Sessão não pronta. Nada foi enviado e a Idempotency-Key é liberada para nova tentativa
        "422":
          description: Idempotency-Key já usada com outro conteúdo
        "200":
          description: Publicado
        "403":
          description: Token não é da instância, ou não é token de instância

  /instances/{id}/stories/media:
    post:
      summary: Publicar story de imagem ou vídeo
      tags: [Stories]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/idempotencyKey"
      description: >-
        Publica um story de imagem ou vídeo. A audiência não é informada pelo
        chamador: vale a configuração de privacidade de status da conta,
        consultável em GET /instances/{id}/whatsapp/status-privacy.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, file]
              properties:
                whatsappId:
                  $ref: "#/components/schemas/WhatsAppMessageId"
                type:
                  type: string
                  enum: [image, video]
                file:
                  type: string
                  format: binary
                caption:
                  type: string
                  description: Legenda (opcional)
      responses:
        "409":
          description: Requisição com a mesma Idempotency-Key ainda em andamento
        "503":
          description: Sessão não pronta. Nada foi enviado e a Idempotency-Key é liberada para nova tentativa
        "422":
          description: Idempotency-Key já usada com outro conteúdo
        "200":
          description: Publicado
        "403":
          description: Token não é da instância, ou não é token de instância

components:
  securitySchemes:
    userJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT de sessão, obtido em POST /auth/login. Expira conforme JWT_EXP_HOURS.
        Identifica um usuário (claim sub).
    apiToken:
      type: http
      scheme: bearer
      description: >
        Token de integração, gerado por um admin em POST /users/{id}/token. Não expira.
        Identifica o mesmo usuário do JWT, para uso servidor a servidor.
    instanceToken:
      type: http
      scheme: bearer
      description: >
        Token com escopo de UMA instância, entregue na criação e trocável em
        POST /instances/{id}/token/rotate. Só acessa a própria instância.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Depreciado, mantido para não quebrar quem já referencia este nome.
        Use userJwt, apiToken ou instanceToken conforme o caso.

  parameters:
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 255
      description: >
        Chave gerada pelo cliente (UUID v4 serve) que torna seguro repetir o envio.
        A primeira chamada guarda o resultado por 24h, e uma repetição com a mesma
        chave devolve o mesmo resultado, com o header X-Idempotent-Replay: true,
        em vez de mandar a mensagem de novo.
    instanceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    userId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    callId:
      name: callId
      in: path
      required: true
      schema:
        type: string
      description: callId recebido no webhook call.offer ou no retorno de POST /calls

  schemas:
    WhatsAppMessageId:
      type: string
      pattern: "^[0-9A-F]{16,32}$"
      example: "3EB0A1B2C3D4E5F6071829"
      description: >-
        ID da mensagem no WhatsApp escolhido por quem envia (opcional). Use hexadecimal maiúsculo
        com 16 a 32 caracteres, como "3EB0" seguido de 18 caracteres hexadecimais. Fora do formato, a resposta é 400.
        Sem ele, o gateway gera um ID e o mantém em todas as retentativas. O mesmo ID volta em
        `whatsappId` na resposta e no eco do envio, o que permite reconhecer a própria mensagem
        pelo ID. Reenviar um ID que esta instância já enviou com sucesso devolve o resultado
        anterior, sem enviar de novo, mesmo que o destinatário ou o conteúdo sejam outros: use um
        ID novo para cada mensagem.
    Call:
      type: object
      properties:
        callId:
          type: string
        peer:
          type: string
          description: JID do outro lado (pode ser @lid)
        direction:
          type: string
          enum: [incoming, outgoing]
        state:
          type: string
          enum: [idle, calling, ringing, connecting, active, ended]
        startedAt:
          type: string
          format: date-time
        isVideo:
          type: boolean
        groupJid:
          type: string
          description: presente quando a ligação começou num grupo
