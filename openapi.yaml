components:
  securitySchemes:
    userJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT de sessão, obtido em POST /auth/login. Expira conforme JWT_EXP_HOURS.
        Identifica um usuário (claim sub).
    apiToken:
      type: http
      scheme: bearer
      description: >
        Token de integração, gerado por um admin em POST /users/{id}/token. Não expira.
        Identifica o mesmo usuário do JWT, para uso servidor a servidor.
    instanceToken:
      type: http
      scheme: bearer
      description: >
        Token com escopo de UMA instância, entregue na criação e trocável em
        POST /instances/{id}/token/rotate. Só acessa a própria instância.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Depreciado, mantido para não quebrar quem já referencia este nome.
        Use userJwt, apiToken ou instanceToken conforme o caso.

  parameters:
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 255
      description: >
        Chave gerada pelo cliente (UUID v4 serve) que torna seguro repetir o envio.
        A primeira chamada guarda o resultado por 24h, e uma repetição com a mesma
        chave devolve o mesmo resultado, com o header X-Idempotent-Replay: true,
        em vez de mandar a mensagem de novo.
    instanceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    userId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
