openapi: 3.0.3
info:
  title: ApiMe
  version: "1.4.0"
  description: |
    API para orquestração de múltiplas instâncias de WhatsApp.

    Autenticação: header `Authorization: Bearer <token>`, com três tipos de credencial
    (userJwt, apiToken, instanceToken). O middleware valida em cascata e para no primeiro
    que reconhecer o token.

    Escopo: `instanceToken` só alcança a própria instância. As rotas de perfil
    (`/instances/{id}/profile/*`, `/instances/{id}/business/*`) exigem `instanceToken` e
    recusam os demais. As rotas `/users/*` exigem usuário com role admin.

servers:
  - url: http://localhost:8080/api
    description: Local

paths:
  /healthz:
    get:
      summary: Health check
      tags: [Sistema]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /auth/login:
    post:
      summary: Autenticar usuário
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Token JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string

  /users:
    get:
      summary: Listar usuários
      tags: [Usuários]
      security: [{userJwt: []}, {apiToken: []}]  # exige role admin
      responses:
        "200":
          description: Lista de usuários
    post:
      summary: Criar usuário
      tags: [Usuários]
      security: [{userJwt: []}, {apiToken: []}]  # exige role admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum: [admin, user]
      responses:
        "201":
          description: Usuário criado

  /users/{id}:
    delete:
      summary: Remover usuário
      tags: [Usuários]
      security: [{userJwt: []}, {apiToken: []}]  # exige role admin
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: Removido

  /users/{id}/password:
    patch:
      summary: Alterar senha
      tags: [Usuários]
      security: [{userJwt: []}, {apiToken: []}]  # exige role admin
      parameters:
        - $ref: "#/components/parameters/userId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        "200":
          description: Senha alterada

  /users/{id}/token:
    post:
      summary: Rotacionar API token do usuário
      tags: [Usuários]
      security: [{userJwt: []}, {apiToken: []}]  # exige role admin
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: Novo token gerado
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string

  /instances:
    get:
      summary: Listar instâncias
      tags: [Instâncias]
      security: [{userJwt: []}, {apiToken: []}]  # token de instância recebe 403}, {apiToken: []}, {instanceToken: []}]
      responses:
        "200":
          description: Lista de instâncias
    post:
      summary: Criar instância
      tags: [Instâncias]
      security: [{userJwt: []}, {apiToken: []}]  # token de instância recebe 403}, {apiToken: []}, {instanceToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                webhook_url:
                  type: string
                webhook_secret:
                  type: string
      responses:
        "201":
          description: Instância criada

  /instances/{id}:
    get:
      summary: Detalhar instância
      tags: [Instâncias]
      security: [{userJwt: []}, {apiToken: []}, {instanceToken: []}]  # token de instância só lê a própria}, {apiToken: []}, {instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: Dados da instância
    put:
      summary: Atualizar instância
      tags: [Instâncias]
      security: [{userJwt: []}, {apiToken: []}]  # token de instância recebe 403}, {apiToken: []}, {instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                webhook_url:
                  type: string
                webhook_secret:
                  type: string
                calls_enabled:
                  type: boolean
                  description: |
                    Liga o motor de chamadas de voz nesta instância. Desligado por padrão, porque o
                    motor pré-aceita toda ligação recebida. Mudar o valor troca o cliente WhatsApp da
                    instância (reconecta em segundos, sem novo QR).
      responses:
        "200":
          description: Atualizada
    delete:
      summary: Remover instância
      tags: [Instâncias]
      security: [{userJwt: []}, {apiToken: []}]  # token de instância recebe 403}, {apiToken: []}, {instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "204":
          description: Removida

  /instances/{id}/qr:
    get:
      summary: Gerar QR Code
      tags: [Conexão]
      security: [{userJwt: []}, {apiToken: []}, {instanceToken: []}]  # token de instância só lê a própria}, {apiToken: []}, {instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: QR code base64

  /instances/{id}/disconnect:
    post:
      summary: Desconectar instância
      tags: [Conexão]
      security: [{userJwt: []}, {apiToken: []}, {instanceToken: []}]  # token de instância só desconecta a própria}, {apiToken: []}]  # token de instância recebe 403}, {apiToken: []}, {instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: Desconectado

  /instances/{id}/token/rotate:
    post:
      summary: Rotacionar token da instância
      tags: [Instâncias]
      security: [{userJwt: []}, {apiToken: []}]  # token de instância recebe 403}, {apiToken: []}, {instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: Novo token

  /instances/{id}/messages/text:
    post:
      summary: Enviar texto
      tags: [Mensagens]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, text]
              properties:
                whatsappId:
                  $ref: "#/components/schemas/WhatsAppMessageId"
                to:
                  type: string
                  example: "5511999999999"
                text:
                  type: string
                quoted:
                  type: string
                  description: Message ID (HEX) da mensagem citada
      responses:
        "409":
          description: Requisição com a mesma Idempotency-Key ainda em andamento
        "503":
          description: Sessão não pronta. Nada foi enviado e a Idempotency-Key é liberada para nova tentativa
        "422":
          description: Idempotency-Key já usada com outro conteúdo
        "200":
          description: Enviado

  /instances/{id}/messages/media:
    post:
      summary: Enviar mídia (imagem, vídeo, GIF ou figurinha)
      tags: [Mensagens]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [to, type, file]
              properties:
                whatsappId:
                  $ref: "#/components/schemas/WhatsAppMessageId"
                to:
                  type: string
                  description: JID do destinatário
                type:
                  type: string
                  enum: [image, video, gif, sticker]
                  description: >-
                    Tipo de mídia. "gif" é enviado como vídeo MP4 com reprodução
                    em laço (o WhatsApp não aceita arquivo .gif: ele chegaria
                    como imagem parada). "sticker" exige WebP 512x512 de no
                    máximo 500 KB, animado ou não.
                file:
                  type: string
                  format: binary
                  description: >-
                    Arquivo. Imagem e vídeo aceitam os formatos usuais; "gif"
                    espera MP4; "sticker" espera WebP 512x512 até 500 KB.
                caption:
                  type: string
                  description: >-
                    Legenda (opcional). Ignorada em "sticker": o protocolo não
                    tem esse campo na figurinha.
                quoted:
                  type: string
                  description: ID da mensagem citada (opcional)
      responses:
        "409":
          description: Requisição com a mesma Idempotency-Key ainda em andamento
        "503":
          description: Sessão não pronta. Nada foi enviado e a Idempotency-Key é liberada para nova tentativa
        "422":
          description: Idempotency-Key já usada com outro conteúdo
        "200":
          description: Enviado


  /instances/{id}/messages/audio:
    post:
      summary: Enviar áudio
      tags: [Mensagens]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [to, file]
              properties:
                whatsappId:
                  $ref: "#/components/schemas/WhatsAppMessageId"
                to:
                  type: string
                  description: JID do destinatário
                file:
                  type: string
                  format: binary
                  description: Arquivo de áudio
                ptt:
                  type: boolean
                  description: Push-to-Talk (áudio de voz)
                  default: false
                seconds:
                  type: integer
                  description: Duração em segundos
                quoted:
                  type: string
                  description: ID da mensagem citada (opcional)
      responses:
        "409":
          description: Requisição com a mesma Idempotency-Key ainda em andamento
        "503":
          description: Sessão não pronta. Nada foi enviado e a Idempotency-Key é liberada para nova tentativa
        "422":
          description: Idempotency-Key já usada com outro conteúdo
        "200":
          description: Enviado


  /instances/{id}/messages/document:
    post:
      summary: Enviar documento
      tags: [Mensagens]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [to, file]
              properties:
                whatsappId:
                  $ref: "#/components/schemas/WhatsAppMessageId"
                to:
                  type: string
                  description: JID do destinatário
                file:
                  type: string
                  format: binary
                  description: Arquivo do documento
                caption:
                  type: string
                  description: Legenda (opcional)
                filename:
                  type: string
                  description: Nome do arquivo (opcional)
                quoted:
                  type: string
                  description: ID da mensagem citada (opcional)
      responses:
        "409":
          description: Requisição com a mesma Idempotency-Key ainda em andamento
        "503":
          description: Sessão não pronta. Nada foi enviado e a Idempotency-Key é liberada para nova tentativa
        "422":
          description: Idempotency-Key já usada com outro conteúdo
        "200":
          description: Enviado


  /media/{instanceId}/{mediaId}:
    get:
      summary: Download de mídia
      tags: [Mídia]
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Arquivo binário

  /instances/{id}/info:
    get:
      summary: Informações da instância conectada
      tags: [Conexão]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: Status e JID da instância

  /instances/{id}/whatsapp/groups:
    get:
      summary: Listar grupos que a instância faz parte
      tags: [WhatsApp]
      security: [{userJwt: []}, {apiToken: []}, {instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: Lista de grupos
    post:
      summary: Criar grupo
      tags: [WhatsApp]
      security: [{userJwt: []}, {apiToken: []}, {instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                participants:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Grupo criado

  /instances/{id}/profile/{jid}:
    get:
      summary: Obter perfil de contato
      tags: [Perfil]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - name: jid
          in: path
          required: true
          schema:
            type: string
          description: JID do contato
      responses:
        "200":
          description: "Dados do perfil. Conta business verificada traz também businessName, o nome verificado."

  /instances/{id}/business/{jid}:
    get:
      summary: Obter perfil business
      tags: [Perfil]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - name: jid
          in: path
          required: true
          schema:
            type: string
          description: JID do contato
      responses:
        "200":
          description: Dados do perfil business

  /instances/{id}/profile/{jid}/picture:
    get:
      summary: Obter foto de perfil
      tags: [Perfil]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - name: jid
          in: path
          required: true
          schema:
            type: string
          description: JID do contato
      responses:
        "200":
          description: URL da foto de perfil

  /instances/{id}/messages:
    post:
      summary: Enfileirar mensagem genérica
      tags: [Mensagens]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, type, payload]
              properties:
                to:
                  type: string
                type:
                  type: string
                  description: Tipo da mensagem
                payload:
                  type: string
                  description: Conteúdo serializado
      responses:
        "409":
          description: Requisição com a mesma Idempotency-Key ainda em andamento
        "503":
          description: Sessão não pronta. Nada foi enviado e a Idempotency-Key é liberada para nova tentativa
        "422":
          description: Idempotency-Key já usada com outro conteúdo
        "200":
          description: Mensagem enfileirada
    get:
      summary: Listar mensagens da instância
      tags: [Mensagens]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: Lista de mensagens

  /instances/{id}/messages/contact:
    post:
      summary: Enviar contato
      tags: [Mensagens]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, displayName]
              properties:
                whatsappId:
                  $ref: "#/components/schemas/WhatsAppMessageId"
                to:
                  type: string
                displayName:
                  type: string
                vcard:
                  type: string
                quoted:
                  type: string
                  description: ID da mensagem citada
                quotedParticipant:
                  type: string
                quotedText:
                  type: string
                quotedFromMe:
                  type: boolean
                mentionedJids:
                  type: array
                  items:
                    type: string
      responses:
        "409":
          description: Requisição com a mesma Idempotency-Key ainda em andamento
        "503":
          description: Sessão não pronta. Nada foi enviado e a Idempotency-Key é liberada para nova tentativa
        "422":
          description: Idempotency-Key já usada com outro conteúdo
        "200":
          description: Contato enviado

  /instances/{id}/messages/location:
    post:
      summary: Enviar localização
      tags: [Mensagens]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, latitude, longitude]
              properties:
                whatsappId:
                  $ref: "#/components/schemas/WhatsAppMessageId"
                to:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
                name:
                  type: string
                address:
                  type: string
                quoted:
                  type: string
                quotedParticipant:
                  type: string
                quotedText:
                  type: string
                quotedFromMe:
                  type: boolean
      responses:
        "409":
          description: Requisição com a mesma Idempotency-Key ainda em andamento
        "503":
          description: Sessão não pronta. Nada foi enviado e a Idempotency-Key é liberada para nova tentativa
        "422":
          description: Idempotency-Key já usada com outro conteúdo
        "200":
          description: Localização enviada

  /instances/{id}/events:
    get:
      summary: Histórico de eventos de conexão da instância
      tags: [Instâncias]
      security: [{userJwt: []}, {apiToken: []}, {instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: Lista de eventos

  /tokens:
    get:
      summary: Listar tokens de API do usuário
      tags: [Tokens]
      security: [{userJwt: []}, {apiToken: []}]
      responses:
        "200":
          description: Lista de tokens
    post:
      summary: Criar token de API
      tags: [Tokens]
      security: [{userJwt: []}, {apiToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                expiresAt:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Token criado

  /tokens/{tokenId}:
    delete:
      summary: Remover token de API
      tags: [Tokens]
      security: [{userJwt: []}, {apiToken: []}]
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removido

  /instances/{id}/calls:
    post:
      summary: Iniciar ligação de voz
      tags: [Chamadas]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
                  description: telefone (+5511...), JID de telefone ou JID @lid
                video:
                  type: boolean
                  description: liga com vídeo; a câmera passa pela ponte de mídia
      responses:
        "201":
          description: Oferta enviada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "409":
          description: Chamadas desativadas nesta instância (calls_enabled)
    get:
      summary: Listar ligações em andamento
      tags: [Chamadas]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: Ligações acompanhadas pelo motor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Call"
        "409":
          description: Chamadas desativadas nesta instância

  /instances/{id}/calls/{callId}:
    get:
      summary: Detalhar ligação
      tags: [Chamadas]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/callId"
      responses:
        "200":
          description: Ligação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "404":
          description: Ligação não encontrada
    delete:
      summary: Desligar ligação
      tags: [Chamadas]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/callId"
      responses:
        "200":
          description: Encerrada
        "404":
          description: Ligação não encontrada

  /instances/{id}/calls/{callId}/answer:
    post:
      summary: Atender ligação recebida
      tags: [Chamadas]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/callId"
      responses:
        "200":
          description: Atendida
        "404":
          description: Ligação não encontrada
        "409":
          description: Chamadas desativadas nesta instância

  /instances/{id}/calls/{callId}/reject:
    post:
      summary: Recusar ligação recebida
      description: |
        Funciona também sem o motor de chamadas: informe em `from` o `rejectFrom` do webhook
        `call.offer`. É o caminho da recusa automática.
      tags: [Chamadas]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/callId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  description: rejectFrom do webhook call.offer (só sem o motor)
      responses:
        "200":
          description: Recusada
        "404":
          description: Ligação não encontrada e `from` ausente

  /instances/{id}/calls/{callId}/video:
    post:
      summary: Controlar o vídeo da ligação
      description: |
        `start` pede para passar a ligação de voz para vídeo, `accept` aceita o pedido do outro
        lado (webhook `call.video` com `video: upgrade_requested`), `stop` encerra o vídeo deste
        lado, `pause` e `resume` desligam e religam a câmera sem sair do vídeo.
      tags: [Chamadas]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/callId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [start, accept, stop, pause, resume]
      responses:
        "200":
          description: Aplicado
        "400":
          description: Ação inválida
        "404":
          description: Ligação não encontrada
        "409":
          description: Chamadas desativadas nesta instância

  /instances/{id}/calls/{callId}/media:
    get:
      summary: Ponte de mídia da ligação (WebSocket)
      description: |
        Upgrade para WebSocket com a mídia nos dois sentidos. Para o backend do consumidor, que
        guarda o token da instância; o navegador chega por ele, nunca com o token.

        Mensagem binária: o primeiro byte diz o tipo. `1` é áudio PCM16LE mono 16 kHz (em
        qualquer tamanho de bloco ao enviar), `2` é um access unit H.264 Annex-B.

        Mensagem de texto: `{"type":"orientation","value":n}`, os quartos de volta no sentido
        horário que deixam o vídeo em pé. O apime manda quando a câmera do outro lado gira, e o
        consumidor manda para anunciar a sua.

        Uma ponte nova na mesma ligação substitui a anterior.
      tags: [Chamadas]
      security: [{instanceToken: []}]
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/callId"
      responses:
        "101":
          description: WebSocket aberto
        "404":
          description: Ligação não encontrada
        "409":
          description: Chamadas desativadas nesta instância

