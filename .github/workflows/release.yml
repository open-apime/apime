# Every push to main becomes a release: the version comes from the commit types since the last tag,
# the image goes to GHCR for amd64 and arm64, and the GitHub release carries the notes.
name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/open-apime/apime

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      next: ${{ steps.next.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
          range="$last..HEAD"
          [ "$last" = v0.0.0 ] && range=HEAD
          subjects=$(git log --no-merges --format=%s "$range")
          bodies=$(git log --no-merges --format=%b "$range")
          # Only docs, ci, test or style since the last tag: nothing to ship.
          if [ -z "$(printf '%s\n' "$subjects" | grep -vE '^(docs|ci|test|style)(\(.+\))?: ' | grep -v '^$')" ]; then
            echo "Nothing to release since $last."
            exit 0
          fi
          IFS=. read -r major minor patch <<< "${last#v}"
          if printf '%s\n' "$subjects" | grep -qE '^[a-z]+(\(.+\))?!: ' || printf '%s\n' "$bodies" | grep -q '^BREAKING CHANGE'; then
            major=$((major + 1)); minor=0; patch=0
          elif printf '%s\n' "$subjects" | grep -qE '^feat(\(.+\))?: '; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          echo "next=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "$last -> v$major.$minor.$patch"

  image:
    needs: version
    if: needs.version.outputs.next != ''
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Native runner per arch: the CGO build under emulation takes too long.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: [version, image]
    runs-on: ubuntu-24.04
    env:
      NEXT: ${{ needs.version.outputs.next }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-arch image
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create -t "$IMAGE:$NEXT" -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Create the GitHub release
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          range=${last:+$last..}HEAD
          log=$(git log --no-merges --format='- %s (%h)' "$range")
          section() {
            if [ -n "$2" ]; then printf '### %s\n\n%s\n\n' "$1" "$2"; fi
          }
          feat='^- feat(\(.+\))?!?: '
          fix='^- fix(\(.+\))?!?: '
          deps='^- (chore|build)\(deps\)!?: '
          skip='^- (docs|ci|test|style)(\(.+\))?!?: '
          {
            section 'Novidades' "$(printf '%s\n' "$log" | grep -E "$feat" || true)"
            section 'Correções' "$(printf '%s\n' "$log" | grep -E "$fix" || true)"
            section 'Dependências' "$(printf '%s\n' "$log" | grep -E "$deps" || true)"
            section 'Outros' "$(printf '%s\n' "$log" | grep -vE "$feat|$fix|$deps|$skip" || true)"
            printf 'Imagem: `%s:%s` (amd64 e arm64)\n' "$IMAGE" "$NEXT"
          } > notes.md
          gh release create "$NEXT" --target "$GITHUB_SHA" --title "$NEXT" --notes-file notes.md
